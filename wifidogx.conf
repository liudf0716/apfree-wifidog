ExternalInterface eth0
AuthServerMode 1
DeviceID 110101100551
AuthServer {
        Hostname awportal.d-gz.com
        HTTPPort 443
        Path /wifidog/
}
WebSocket {
        WSServer awportal.d-gz.com
        WSServerPort 443
        WSServerPath /ws/wifidogx
        WSServerSSL 1
}
DeviceInfo {
        ApDeviceId AW17701125CC7D742A338
        ApMacAddress 5C-C7-D7-42-A3-38
        ApLongitude 116.395000
        ApLatitude 039.911000
        LocationId 11010110055155
}
GatewaySetting {
        GatewayAuthEnabled 1
        GatewayInterface docker0
        GatewayChannel apfree
        GatewayID 5CC7D742A336
        GatewaySubnetV4 192.168.81.1/24
}
CheckInterval 60
ClientTimeout 5
JsFilter 1
WiredPassed 1
BypassAppleCNA 0
EnableDNSForward 1
EnableAntiNat 0
TTLValues 64,128,255
# Portal session ticket (P2 dual-track; secret auto-generated if omitted)
# PortalTicketSecret <hex-or-raw-secret-min-16-bytes>
PortalTicketTTL 100
PortalTicketStoreMax 1024
PortalTicketStrictIp 0
# Set to 1 only after AWAS requirePortalTicket=true and all gateways upgraded
PortalTicketRequired 0
# Remote shell over MQTT/WebSocket is off by default even if compiled in.
# EnableRemoteShell 0
# Privileged control-plane ops (OTA/reboot/Wi-Fi/VPN/server changes) are off.
# Toggle at runtime with MQTT/WS set_privileged_ops (secret required to enable).
# EnablePrivilegedOps 0
# PrivilegedOpsSecret chawrt@2026
